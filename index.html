      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .translator-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 650px;
      border-top: 8px solid #0397CD;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    .flag-banner {
      display: flex;
      height: 25px;
      width: 70px;
      margin: 0 auto 15px auto;
      border: 1px solid #ccc;
    }
    .flag-white { width: 20%; background-color: #ffffff; }
    .flag-blue { width: 80%; background-color: #0397CD; }

    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #0397CD;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 15px;
      font-weight: bold;
    }

    button:hover {
      background-color: #027da8;
    }

    .output-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #eef8fc;
      border-left: 4px solid #0397CD;
      border-radius: 4px;
      font-size: 18px;
      min-height: 40px;
      word-break: break-word;
    }
  </style>
</head>

    function translateToKotiya() {
      const input = document.getElementById("sourceText").value;
      if (!input.trim()) {
        document.getElementById("outputResult").innerText = "...";
        return;
      }

      const words = input.split(/\s+/);

      const translatedWords = words.map(word => {
        const cleanWord = word.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
        
        if (kotiyaDictionary[cleanWord]) {
          return kotiyaDictionary[cleanWord];
        } else {
          return word;
        }
      });

      document.getElementById("outputResult").innerText = translatedWords.join(" ");
    }
